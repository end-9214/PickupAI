version: '3.8'

services:
  django-backend:
    build: .
    container_name: phone_agent_backend
    restart: unless-stopped
    command: python backend/manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./db.sqlite3:/app/db.sqlite3
    network_mode: host


  livekit-agent:
    build: .
    container_name: phone_agent_worker
    restart: unless-stopped
    command: python agent.py dev
    env_file:
      - .env
    volumes:
      - ./agent.py:/app/agent.py
      - ./voice:/app/voice
    network_mode: host
    depends_on:
      - django-backend
